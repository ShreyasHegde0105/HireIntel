[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-sorting-stage1"
version = "0.1.0"
description = "Stage 1 document reader for the Resume Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "pydantic>=2.7,<3.0",
  "PyMuPDF>=1.24,<2.0",
  "pdfplumber>=0.11,<1.0",
  "python-docx>=1.1,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
include = ["resume_platform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
